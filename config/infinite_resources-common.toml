
#Infinite Resources Granular Unification Configuration
[materials]

	[materials.iron]
		#Enable/Disable JEI visibility and functionality for: iron dust
		enable_dust = true
		#Enable/Disable JEI visibility and functionality for: iron plate
		enable_plate = true
		#Enable/Disable JEI visibility and functionality for: iron gear
		enable_gear = true

